# Single-command deploy:
#   cd mieru-panel
#   PANEL_SERVER_IP=<your.public.ip> docker compose up -d --build
#
# Both images are built from local sources – no Docker Hub image required.

services:
  mita:
    build:
      context: ..
      dockerfile: deployments/docker/mita/Dockerfile
    image: mieru-mita:local
    container_name: mita
    restart: unless-stopped
    network_mode: host
    # Override the upstream CMD so mita stdout/stderr is captured into a
    # shared log file. The panel reads the tail of this file from the
    # "Logs" tab. `tee` keeps stdout going so `docker compose logs mita`
    # still works.
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /var/log/mita
        : > /var/log/mita/mita.log
        echo "[entrypoint] starting mita run, mirroring stdout to /var/log/mita/mita.log"
        exec /usr/local/bin/mita run 2>&1 | tee -a /var/log/mita/mita.log
    environment:
      # Skip chowning the unix domain socket to user "mita". Inside the
      # container the panel CLI already runs as root, and chown can fail
      # when /var/run/mita is a docker-managed volume on certain hosts.
      - MITA_INSECURE_UDS=1
      - MITA_LOG_NO_TIMESTAMP=
    volumes:
      - mita_data:/var/lib/mita
      - mita_run:/var/run/mita
      - mita_logs:/var/log/mita
    cap_add:
      - NET_ADMIN

  panel:
    build:
      context: ..
      dockerfile: mieru-panel/Dockerfile
    image: mieru-panel:local
    container_name: mieru-panel
    restart: unless-stopped
    network_mode: host
    volumes:
      - panel_data:/app/data
      - mita_run:/var/run/mita
      - mita_logs:/var/log/mita:ro
    environment:
      # The panel auto-creates data/config.json on first start.
      # PANEL_ADMIN_PASS resets the admin password on every restart, set it once
      # and clear afterwards. PANEL_SERVER_IP can also be edited later in the UI.
      - PANEL_CONFIG=/app/data/config.json
      - PANEL_HOST=0.0.0.0
      - MITA_SOCKET=/var/run/mita/mita.sock
      - MITA_LOG_FILE=/var/log/mita/mita.log
      - PANEL_ADMIN_USER=${PANEL_ADMIN_USER:-admin}
      - PANEL_ADMIN_PASS=${PANEL_ADMIN_PASS:-admin}
      - PANEL_SERVER_IP=${PANEL_SERVER_IP:-}
      - PANEL_DEFAULT_PORT=${PANEL_DEFAULT_PORT:-2015}
      - PANEL_PORT_RANGE=${PANEL_PORT_RANGE:-2012-2022}
    depends_on:
      - mita

volumes:
  mita_data:
  mita_run:
  mita_logs:
  panel_data:
